    <title>Iasmin | Histórias Exclusivas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@200..800&family=Parisienne&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #050505;
        color: #f5f5f5;
        overflow-x: hidden;
      }
      .font-serif {
        font-family: 'Playfair Display', serif;
      }
      .font-cursive {
        font-family: 'Parisienne', cursive;
      }
      /* Subtle Neon Effects */
      .neon-text-rose {
        text-shadow: 0 0 10px rgba(225, 29, 72, 0.4), 0 0 20px rgba(225, 29, 72, 0.2);
      }
      .neon-border-rose {
        box-shadow: 0 0 15px rgba(225, 29, 72, 0.15);
      }
      .glow-bg {
        filter: blur(80px);
        background: radial-gradient(circle, rgba(74, 29, 29, 0.2) 0%, rgba(5, 5, 5, 0) 70%);
      }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #050505;
      }
      ::-webkit-scrollbar-thumb {
        background: #3a1010;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #5a1d1d;
      }

      @keyframes neon-pulse {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; text-shadow: 0 0 15px rgba(225, 29, 72, 0.6); }
      }
      .animate-neon-pulse {
        animation: neon-pulse 3s infinite ease-in-out;
      }
    </style>
